<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punya Nagari - Live News Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Font Awesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .bg-punya-red { background-color: #d32f2f; }
        .text-punya-red { color: #d32f2f; }
    </style>
</head>
<body>

    <!-- React Root Container -->
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const PunyanagariPortal = () => {
            // Language State Selection ('mr' or 'en')
            const [language, setLanguage] = useState('mr');
            const [currentTime, setCurrentTime] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('All');
            const [searchKeyword, setSearchKeyword] = useState('');
            const [activeArticle, setActiveArticle] = useState(null);

            // Digital Clock Effect
            useEffect(() => {
                const updateClock = () => {
                    const now = new Date();
                    const options = { year: 'numeric', month: 'long', day: 'numeric' };
                    const dateString = now.toLocaleDateString(language === 'mr' ? 'mr-IN' : 'en-US', options);
                    const timeString = now.toLocaleTimeString(language === 'mr' ? 'mr-IN' : 'en-US', { hour12: true });
                    setCurrentTime(`${dateString} - ${timeString}`);
                };
                updateClock();
                const timerId = setInterval(updateClock, 1000);
                return () => clearInterval(timerId);
            }, [language]);

            // Dictionary for Interface UI Text
            const translations = {
                mr: {
                    portalName: "पुण्य नगरी न्यूज पोर्टल",
                    admissionsText: "प्रवेश सुरू २०२६-२७",
                    searchPlaceholder: "बातम्या शोधा...",
                    showingCountText: "दर्शविलेल्या बातम्या",
                    noArticlesFound: "या श्रेणीसाठी कोणतीही बातमी आढळली नाही.",
                    readMoreBtn: "सविस्तर वाचा",
                    allCategory: "सर्व",
                    footerCopyright: "सर्व हक्क सुरक्षित © २०२६ दैनिक पुण्य नगरी"
                },
                en: {
                    portalName: "Punya Nagari News Portal",
                    admissionsText: "ADMISSIONS OPEN 2026-27",
                    searchPlaceholder: "Search news...",
                    showingCountText: "Showing articles",
                    noArticlesFound: "No news articles found for this category.",
                    readMoreBtn: "Read More",
                    allCategory: "All",
                    footerCopyright: "All Rights Reserved © 2026 Daily Punya Nagari"
                }
            };

            // Category Dictionary
            const categoryList = [
                { id: 'Accidents', text: { mr: 'अपघात', en: 'Accidents' } },
                { id: 'Agriculture', text: { mr: 'कृषी', en: 'Agriculture' } },
                { id: 'Finance', text: { mr: 'अर्थजगत', en: 'Finance' } },
                { id: 'Crime', text: { mr: 'गुन्हेगारी', en: 'Crime' } },
                { id: 'Education', text: { mr: 'शिक्षण', en: 'Education' } },
                { id: 'Sports', text: { mr: 'क्रीडा', en: 'Sports' } }
            ];

            // News Feed Data
            const articlesList = [
                {
                    id: 1,
                    category: 'Accidents',
                    tags: { mr: ['अपघात', 'महामार्ग'], en: ['Accident', 'Highway'] },
                    imagePrimary: 'https://images.unsplash.com/photo-1563720223185-11003d516935?auto=format&fit=crop&w=400&q=80',
                    imageSecondary: 'https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?auto=format&fit=crop&w=400&q=80',
                    headline: {
                        mr: "मुंबई-पुणे एक्सप्रेसवेवर ट्रॅव्हल्स आणि ट्रकचा भीषण अपघात",
                        en: "Fatal Collision Between Private Bus and Truck on Mumbai-Pune Expressway"
                    },
                    publishedDate: "17 September 2026",
                    summary: {
                        mr: "खालापूर टोल नाक्याजवळ लक्झरी बस उभ्या असलेल्या ट्रकला धडकल्याने ४ प्रवासी गंभीर जखमी...",
                        en: "At least 4 injured as a speeding luxury bus crashed into a stationary freight truck near Khalapur toll plaza..."
                    },
                    details: {
                        mr: "मुंबई-पुणे एक्सप्रेसवेवर खालापूर टोल नाक्याजवळ आज पहाटे खाजगी लक्झरी बस आणि ट्रकचा भीषण अपघात झाला. यामध्ये ४ प्रवासी गंभीर जखमी झाले असून त्यांना जवळच्या रुग्णालयात दाखल करण्यात आले आहे.",
                        en: "A major collision took place on the Mumbai-Pune Expressway early Tuesday morning when a private luxury bus rammed into a stationary freight truck near the Khalapur toll plaza. Emergency response teams rushed to the scene immediately."
                    }
                },
                {
                    id: 2,
                    category: 'Agriculture',
                    tags: { mr: ['शेती', 'हवामान'], en: ['Agri', 'Weather'] },
                    imagePrimary: 'https://images.unsplash.com/photo-1530587191325-3db32d826c18?auto=format&fit=crop&w=400&q=80',
                    imageSecondary: 'https://images.unsplash.com/photo-1500937386664-56d1dfef3854?auto=format&fit=crop&w=400&q=80',
                    headline: {
                        mr: "रब्बी हंगामासाठी जमिनीत पुरेसा ओलावा; उत्पादनात वाढीचा अंदाज",
                        en: "Rabi Crop Yield Projections Rise Following Extended Monsoon Spells"
                    },
                    publishedDate: "17 September 2026",
                    summary: {
                        mr: "परतीच्या पावसामुळे राज्यातील भूजल पातळीत वाढ, शेतकऱ्यांमध्ये आनंदाचे वातावरण...",
                        en: "Agricultural experts predict favorable soil moisture retention benefits upcoming sowing cycles across Maharashtra..."
                    },
                    details: {
                        mr: "परतीच्या पावसामुळे राज्यातील जलसाठ्यांमध्ये मोठी वाढ झाली आहे. त्यामुळे आगामी रब्बी हंगामातील पेरण्यांसाठी अनुकूल परिस्थिती निर्माण झाली असून कृषी तज्ज्ञांनी चांगल्या उत्पादनाचा अंदाज व्यक्त केला आहे.",
                        en: "Recent seasonal rains have significantly recharged groundwater reserves and improved soil moisture, offering highly optimistic forecasts for upcoming Rabi crop sowing across various districts."
                    }
                },
                {
                    id: 3,
                    category: 'Finance',
                    tags: { mr: ['शेअर बाजार', 'अर्थव्यवस्था'], en: ['Finance', 'Market'] },
                    imagePrimary: 'https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?auto=format&fit=crop&w=400&q=80',
                    imageSecondary: 'https://images.unsplash.com/photo-1590283603385-17ffb3a7f29f?auto=format&fit=crop&w=400&q=80',
                    headline: {
                        mr: "शेअर बाजारात मोठी उसळी; सेन्सेक्स ४०० अंकांनी वधारला",
                        en: "Sensex Rebounds by 400 Points Driven by Banking and IT Gains"
                    },
                    publishedDate: "17 September 2026",
                    summary: {
                        mr: "बँकिंग आणि आयटी शेअर्समध्ये जोरदार खरेदीमुळे भारतीय शेअर बाजारात तेजी...",
                        en: "Indian equity benchmarks staged a strong recovery today, buoyed by heavy buying in financial and technology stocks..."
                    },
                    details: {
                        mr: "जागतिक बाजारातील सकारात्मक संकेतांमुळे आज भारतीय शेअर बाजारात मोठी तेजी पाहायला मिळाली. बँकिंग आणि आयटी क्षेत्रातील शेअर्सच्या खरेदीमुळे सेन्सेक्स ४०० पेक्षा जास्त अंकांनी वाढला.",
                        en: "The Indian stock market showed strong resilience today as the BSE Sensex surged over 400 points. Banking and IT stocks led the rally following positive global signals."
                    }
                }
            ];

            // Current active language UI text
            const currentUI = translations[language];

            // Filter logic for category & search keyword
            const filteredArticles = articlesList.filter(article => {
                const isCategoryMatched = selectedCategory === 'All' || article.category === selectedCategory;
                const articleTitle = article.headline[language].toLowerCase();
                const articleSummary = article.summary[language].toLowerCase();
                const isSearchMatched = articleTitle.includes(searchKeyword.toLowerCase()) || 
                                        articleSummary.includes(searchKeyword.toLowerCase());
                return isCategoryMatched && isSearchMatched;
            });

            return (
                <div className="min-h-screen bg-gray-100 flex flex-col justify-between">
                    <div>
                        {/* Top Utility Border / Header with Language Switcher */}
                        <div className="bg-gray-800 text-white text-xs py-1.5 px-4 border-b border-gray-700">
                            <div className="max-w-7xl mx-auto flex justify-between items-center">
                                <div className="flex items-center gap-3">
                                    <span className="font-semibold"><i className="fa-regular fa-clock mr-1"></i>{currentTime}</span>
                                </div>
                                
                                {/* Language Switcher Dropdown on Top Right */}
                                <div className="flex items-center space-x-3">
                                    <div className="text-gray-300 font-bold text-xs hidden md:block">
                                        <i className="fa-solid fa-newspaper mr-1"></i>{currentUI.portalName}
                                    </div>
                                    <div className="flex items-center bg-gray-700 px-2 py-0.5 rounded border border-gray-600">
                                        <i className="fa-solid fa-globe text-yellow-400 mr-1.5 text-xs"></i>
                                        <select 
                                            value={language} 
                                            onChange={(e) => setLanguage(e.target.value)}
                                            className="bg-transparent text-white text-xs font-bold focus:outline-none cursor-pointer">
                                            <option value="mr" className="bg-gray-800 text-white">मराठी</option>
                                            <option value="en" className="bg-gray-800 text-white">English</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Top Banner Advertisement */}
                        <div className="max-w-7xl mx-auto my-2 px-2">
                            <div className="bg-blue-900 text-white rounded p-3 flex items-center justify-between text-xs md:text-sm shadow">
                                <div className="flex items-center space-x-3">
                                    <span className="bg-red-600 px-2 py-1 font-bold rounded">MIT-ADT UNIVERSITY</span>
                                    <div>
                                        <h4 className="font-bold">MIT Art, Design & Technology University, Pune</h4>
                                    </div>
                                </div>
                                <div className="bg-yellow-400 text-black px-3 py-1 font-bold rounded shrink-0">
                                    {currentUI.admissionsText}
                                </div>
                            </div>
                        </div>

                        {/* Main Header Brand Logo */}
                        <div className="bg-punya-red py-4 shadow-md">
                            <div className="max-w-7xl mx-auto flex justify-center items-center">
                                <div className="text-center text-white cursor-pointer" onClick={() => setSelectedCategory('All')}>
                                    <h1 className="text-5xl md:text-6xl font-extrabold tracking-wider border-b-2 border-white pb-1 inline-block uppercase">
                                        Punya<span className="text-yellow-300">॥</span>Nagari
                                    </h1>
                                </div>
                            </div>
                        </div>

                        {/* Search Toolbar Ribbon */}
                        <div className="bg-gray-200 border-b border-gray-300 py-2">
                            <div className="max-w-7xl mx-auto px-4 flex justify-end items-center">
                                <div className="relative w-full md:w-64">
                                    <input 
                                        type="text" 
                                        value={searchKeyword}
                                        onChange={(e) => setSearchKeyword(e.target.value)}
                                        placeholder={currentUI.searchPlaceholder} 
                                        className="w-full pl-3 pr-8 py-1 text-sm border border-gray-400 rounded-full focus:outline-none focus:ring-1 focus:ring-red-600"
                                    />
                                    <i className="fa-solid fa-magnifying-glass absolute right-3 top-2.5 text-gray-500 text-xs"></i>
                                </div>
                            </div>
                        </div>

                        {/* Category Navigation Bar */}
                        <nav className="bg-white border-b border-gray-300 shadow-sm sticky top-0 z-40">
                            <div className="max-w-7xl mx-auto px-2 flex items-center overflow-x-auto whitespace-nowrap text-xs md:text-sm font-semibold py-2">
                                <button 
                                    onClick={() => setSelectedCategory('All')} 
                                    className={`px-3 py-1 font-bold rounded mr-1 transition ${selectedCategory === 'All' ? 'bg-red-600 text-white' : 'text-gray-800 hover:bg-gray-100'}`}>
                                    {currentUI.allCategory}
                                </button>

                                {categoryList.map((cat) => (
                                    <button 
                                        key={cat.id} 
                                        onClick={() => setSelectedCategory(cat.id)}
                                        className={`px-3 py-1 font-bold rounded transition mr-1 ${selectedCategory === cat.id ? 'bg-red-600 text-white' : 'text-gray-800 hover:text-red-600 hover:bg-gray-100'}`}>
                                        {cat.text[language]}
                                    </button>
                                ))}
                            </div>
                        </nav>

                        {/* News Feed Grid */}
                        <div className="max-w-7xl mx-auto px-2 py-4">
                            <div className="bg-red-600 text-white p-2 rounded mb-4 font-bold flex items-center justify-between text-sm shadow">
                                <span>
                                    {selectedCategory === 'All' 
                                        ? currentUI.allCategory 
                                        : categoryList.find(c => c.id === selectedCategory)?.text[language]}
                                </span>
                                <span className="text-xs font-normal">{currentUI.showingCountText}: {filteredArticles.length}</span>
                            </div>

                            {filteredArticles.length === 0 ? (
                                <div className="bg-white p-8 text-center border rounded text-gray-500">
                                    {currentUI.noArticlesFound}
                                </div>
                            ) : (
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    {filteredArticles.map((article) => (
                                        <div 
                                            key={article.id} 
                                            onClick={() => setActiveArticle(article)}
                                            className="bg-white p-3 border rounded shadow-sm hover:shadow-md transition flex flex-col justify-between cursor-pointer">
                                            <div>
                                                <div className="flex gap-1 mb-2 flex-wrap">
                                                    {article.tags[language].map((tagItem, idx) => (
                                                        <span key={idx} className="bg-red-600 text-white text-[10px] font-bold px-2 py-0.5 rounded">
                                                            {tagItem}
                                                        </span>
                                                    ))}
                                                </div>
                                                <div className="grid grid-cols-2 gap-1 mb-2">
                                                    <img src={article.imagePrimary} className="w-full h-28 object-cover rounded" alt="News Image 1" />
                                                    <img src={article.imageSecondary} className="w-full h-28 object-cover rounded" alt="News Image 2" />
                                                </div>
                                                <h3 className="font-bold text-sm leading-snug mb-2 hover:text-red-600">
                                                    {article.headline[language]}
                                                </h3>
                                                <p className="text-xs text-gray-500 mb-2">
                                                    <i className="fa-regular fa-clock mr-1"></i>{article.publishedDate}
                                                </p>
                                                <p className="text-xs text-gray-700 leading-relaxed mb-3">
                                                    {article.summary[language]}
                                                </p>
                                            </div>
                                            <button className="text-xs text-red-600 font-bold hover:underline text-left inline-flex items-center gap-1">
                                                {currentUI.readMoreBtn} <i className="fa-solid fa-arrow-right text-[10px]"></i>
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Article Details Modal */}
                    {activeArticle && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex justify-center items-center p-4">
                            <div className="bg-white rounded-lg max-w-xl w-full p-6 relative max-h-[90vh] overflow-y-auto shadow-2xl">
                                <button 
                                    onClick={() => setActiveArticle(null)}
                                    className="absolute top-3 right-3 text-gray-500 hover:text-black text-2xl font-bold">
                                    &times;
                                </button>
                                <h2 className="text-xl font-bold my-2">{activeArticle.headline[language]}</h2>
                                <p className="text-xs text-gray-500 mb-4">
                                    <i className="fa-regular fa-clock mr-1"></i>{activeArticle.publishedDate}
                                </p>
                                <img src={articleImagePrimary} className="w-full h-56 object-cover rounded mb-4" alt="News detail" />
                                <p className="text-sm text-gray-800 leading-relaxed">
                                    {activeArticle.details[language]}
                                </p>
                            </div>
                        </div>
                    )}

                    {/* Page Footer */}
                    <footer className="bg-gray-900 text-white py-4 text-xs border-t-4 border-red-600 text-center">
                        <p className="text-gray-400">{currentUI.footerCopyright}</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PunyanagariPortal />);
    </script>
</body>
</html>
