<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtue. City - Accident & Emergency News</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const AccidentNewsPage = () => {
            const [news, setNews] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [time, setTime] = useState('');

            // Your NewsAPI Key
            const API_KEY = "5d05254fb522460cb1f0c00f267f0a46";

            useEffect(() => {
                // Real-time Clock
                const updateTime = () => {
                    const now = new Date();
                    setTime(now.toLocaleString('en-US', { 
                        month: 'long', day: 'numeric', year: 'numeric', 
                        hour: 'numeric', minute: 'numeric', second: 'numeric', hour12: true 
                    }));
                };
                updateTime();
                const timer = setInterval(updateTime, 1000);

                // Fetch Live Accident News from API
                const fetchAccidentNews = async () => {
                    try {
                        setLoading(true);
                        const response = await fetch(
                            `https://newsapi.org/v2/everything?q=accident%20OR%20crash&sortBy=publishedAt&language=en&apiKey=${API_KEY}`
                        );

                        if (!response.ok) {
                            throw new Error("Failed to load news from API.");
                        }

                        const data = await response.json();
                        setNews(data.articles || []);
                        setLoading(false);
                    } catch (err) {
                        setError(err.message);
                        setLoading(false);
                    }
                };

                fetchAccidentNews();
                return () => clearInterval(timer);
            }, []);

            return (
                <div className="min-h-screen flex flex-col justify-between">
                    <div>
                        {/* Header Banner */}
                        <div className="bg-[#d32f2f] py-4 text-center text-white shadow-md">
                            <h1 className="text-5xl font-extrabold tracking-wide border-b-2 border-white pb-1 inline-block">
                                Virtue. City
                            </h1>
                        </div>

                        {/* Date, E-Paper, Search Bar */}
                        <div className="bg-gray-200 border-b border-gray-300 py-2">
                            <div className="max-w-7xl mx-auto px-4 flex flex-wrap justify-between items-center text-xs md:text-sm gap-2">
                                <div className="flex items-center space-x-2 text-gray-700 font-semibold">
                                    <i className="fa-regular fa-calendar-days text-red-600"></i>
                                    <span>{time || 'September 15, 2026'}</span>
                                </div>

                                <button className="bg-red-600 hover:bg-red-700 text-white font-bold px-3 py-1 rounded flex items-center gap-2 text-xs">
                                    <i className="fa-solid fa-newspaper"></i> E-PAPER
                                </button>

                                <div className="relative">
                                    <input 
                                        type="text" 
                                        placeholder="Search ..." 
                                        className="pl-3 pr-8 py-1 text-xs md:text-sm border border-gray-400 rounded-full focus:outline-none"
                                    />
                                    <i className="fa-solid fa-magnifying-glass absolute right-3 top-2 text-gray-500 text-xs"></i>
                                </div>
                            </div>
                        </div>

                        {/* Navigation Menu */}
                        <nav className="bg-white border-b border-gray-300 shadow-sm sticky top-0 z-50">
                            <div className="max-w-7xl mx-auto px-2 flex items-center overflow-x-auto whitespace-nowrap text-xs font-semibold py-2 space-x-4">
                                <a href="front.html" className="bg-red-600 text-white p-2 rounded-md">
                                    <i className="fa-solid fa-house"></i>
                                </a>
                                <a href="accident.html" className="text-red-600 font-bold border-b-2 border-red-600 pb-0.5">
                                    Accident
                                </a>
                                <a href="#" className="text-gray-700 hover:text-red-600">Agriculture</a>
                                <a href="#" className="text-gray-700 hover:text-red-600">Environment</a>
                                <a href="#" className="text-gray-700 hover:text-red-600">Trending</a>
                                <a href="#" className="text-gray-700 hover:text-red-600">Special Features</a>
                                <a href="#" className="text-gray-700 hover:text-red-600">Crime</a>
                                <a href="#" className="text-gray-700 hover:text-red-600">Economic</a>
                                <a href="#" className="text-gray-700 hover:text-red-600">Academic</a>
                                <a href="#" className="text-gray-700 hover:text-red-600">Entertainment</a>
                                <a href="#" className="text-gray-700 hover:text-red-600">International</a>
                            </div>
                        </nav>

                        {/* Main Content Area */}
                        <div className="max-w-7xl mx-auto px-2 py-4 flex flex-col lg:flex-row gap-4">
                            
                            {/* Left Ad Banner */}
                            <div className="hidden lg:block w-48 bg-white border p-2 text-center text-xs shadow-sm h-fit shrink-0">
                                <span className="bg-black text-white px-1 text-[10px]">MEDIA PARTNER</span>
                                <div className="font-bold text-red-600 my-2">Virtuous city</div>
                                <img src="https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=200&q=80" className="w-full mb-2 rounded" alt="Ad" />
                                <p className="font-bold">ADMISSIONS OPEN 2026-27</p>
                            </div>

                            {/* Center API News Display */}
                            <div className="flex-1">
                                <div className="bg-red-600 text-white px-3 py-1.5 rounded-t font-bold text-sm flex items-center gap-2 mb-3">
                                    <i className="fa-solid fa-triangle-exclamation"></i> Live Occident / Accident News
                                </div>

                                {loading && (
                                    <div className="bg-white p-10 text-center rounded shadow-sm">
                                        <i className="fa-solid fa-spinner fa-spin text-3xl text-red-600 mb-2"></i>
                                        <p className="text-xs text-gray-600 font-semibold">Fetching latest accident reports...</p>
                                    </div>
                                )}

                                {error && (
                                    <div className="bg-red-100 border border-red-400 text-red-700 p-4 rounded text-xs text-center">
                                        {error}
                                    </div>
                                )}

                                {!loading && !error && (
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        {news.slice(0, 9).map((item, index) => (
                                            <div key={index} className="bg-white p-3 border rounded shadow-sm hover:shadow-md transition flex flex-col justify-between">
                                                <div>
                                                    <span className="bg-red-600 text-white text-[10px] font-bold px-2 py-0.5 rounded inline-block mb-2">
                                                        Occident
                                                    </span>

                                                    <img 
                                                        src={item.urlToImage || 'https://images.unsplash.com/photo-1563720223185-11003d516935?auto=format&fit=crop&w=400&q=80'} 
                                                        alt="News" 
                                                        className="w-full h-32 object-cover rounded mb-2"
                                                        onError={(e) => { e.target.src = 'https://images.unsplash.com/photo-1563720223185-11003d516935?auto=format&fit=crop&w=400&q=80'; }}
                                                    />

                                                    <h3 className="font-bold text-gray-900 text-xs md:text-sm leading-snug hover:text-red-600 cursor-pointer mb-2">
                                                        {item.title}
                                                    </h3>

                                                    <p className="text-[11px] text-gray-500 mb-2">
                                                        <i className="fa-regular fa-clock mr-1"></i>
                                                        {new Date(item.publishedAt).toLocaleDateString()}
                                                    </p>

                                                    <p className="text-xs text-gray-600 leading-relaxed line-clamp-3 mb-3">
                                                        {item.description || "Click read more for full coverage."}
                                                    </p>
                                                </div>

                                                <a 
                                                    href={item.url} 
                                                    target="_blank" 
                                                    rel="noopener noreferrer"
                                                    className="text-xs text-red-600 font-bold hover:underline inline-block mt-auto"
                                                >
                                                    Read More &rarr;
                                                </a>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>

                            {/* Right Side Developments */}
                            <div className="w-full lg:w-64 bg-white border p-3 rounded shadow-sm h-fit shrink-0">
                                <h3 className="font-bold border-b-2 border-red-600 pb-1 mb-3 text-red-600 text-xs flex items-center gap-1">
                                    <i className="fa-solid fa-bolt"></i> Important Developments
                                </h3>
                                <ul className="space-y-3 text-xs divide-y">
                                    <li className="pt-1">
                                        <a href="#" className="font-semibold text-gray-800 hover:text-red-600 block">
                                            Heavy rain warning issued in Maharashtra in the next 24 hours; Meteorological Department's Red Alert
                                        </a>
                                    </li>
                                    <li className="pt-2">
                                        <a href="#" className="font-semibold text-gray-800 hover:text-red-600 block">
                                            The stock market fell sharply; Sensex falls 500 points
                                        </a>
                                    </li>
                                    <li className="pt-2">
                                        <a href="#" className="font-semibold text-gray-800 hover:text-red-600 block">
                                            T20 Series: India win the series by a huge margin
                                        </a>
                                    </li>
                                </ul>
                            </div>

                        </div>
                    </div>

                    {/* Footer */}
                    <footer className="bg-gray-900 text-white mt-8 py-4 text-xs border-t-4 border-red-600">
                        <div className="max-w-7xl mx-auto px-4 text-center">
                            <p className="text-sm font-bold text-red-500 mb-1">Pune Nagari E-Paper and News Channel</p>
                            <p className="text-gray-400">All Rights Reserved © 2026 Daily Virtue City</p>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AccidentNewsPage />);
    </script>
</body>
</html>
