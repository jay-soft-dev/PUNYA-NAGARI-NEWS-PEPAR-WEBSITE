<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punyanagari - Latest Accident News</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Mukta', sans-serif; background-color: #f8fafc; }
        .bg-punya-red { background-color: #d32f2f; }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const AccidentPage = () => {
            const [time, setTime] = useState('');
            const [articles, setArticles] = useState([]);
            const [loading, setLoading] = useState(true);

            // 1. Live Date and Clock Update
            useEffect(() => {
                const updateTime = () => {
                    const now = new Date();
                    const options = { year: 'numeric', month: 'long', day: 'numeric' };
                    const dateStr = now.toLocaleDateString('en-US', options);
                    const timeStr = now.toLocaleTimeString('en-US', { hour12: true });
                    setTime(`${dateStr} at ${timeStr}`);
                };
                updateTime();
                const timer = setInterval(updateTime, 1000);
                return () => clearInterval(timer);
            }, []);

            // 2. NewsAPI Fetching Logic
            useEffect(() => {
                const API_KEY = "5d05254fb522460cb1f0c00f267f0a46";
                setLoading(true);

                // NewsAPI Call for Accident News
                fetch(`https://newsapi.org/v2/everything?q=accident&sortBy=publishedAt&language=en&apiKey=${API_KEY}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.status === "ok" && data.articles && data.articles.length > 0) {
                            const formatted = data.articles.slice(0, 9).map((item, idx) => ({
                                id: idx,
                                title: item.title,
                                excerpt: item.description || "Click the link below to read the full news coverage...",
                                img: item.urlToImage || 'https://images.unsplash.com/photo-1563720223185-11003d516935?auto=format&fit=crop&w=600&q=80',
                                date: new Date(item.publishedAt).toLocaleDateString(),
                                url: item.url,
                                source: item.source.name
                            }));
                            setArticles(formatted);
                        } else {
                            setFallbackData();
                        }
                        setLoading(false);
                    })
                    .catch(err => {
                        console.log("NewsAPI Fetch Error/CORS, loading fallback:", err);
                        setFallbackData();
                        setLoading(false);
                    });
            }, []);

            // Fallback Accident Data
            const setFallbackData = () => {
                setArticles([
                    {
                        id: 1,
                        title: 'Major Accident Near Jambhulwadi on Pune-Bengaluru Highway; 2 Dead, 12 Injured',
                        date: 'September 13, 2026',
                        excerpt: 'A severe multi-vehicle collision involving two trucks, an Ertiga, and an Altroz occurred on the highway. The injured have been admitted to the nearest hospital...',
                        img: 'https://images.unsplash.com/photo-1563720223185-11003d516935?auto=format&fit=crop&w=600&q=80',
                        url: '#'
                    },
                    {
                        id: 2,
                        title: 'Head-On Collision Between Truck and Minivan on Nanded-Bhokar Highway; 8 Dead',
                        date: 'September 11, 2026',
                        excerpt: 'A speeding truck coming from the opposite direction collided head-on with a minivan. Traffic was temporarily disrupted on the highway following the crash...',
                        img: 'https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?auto=format&fit=crop&w=600&q=80',
                        url: '#'
                    },
                    {
                        id: 3,
                        title: 'Fatal Truck-Pickup Crash on Bhandara National Highway Claims 8 Lives Including 3 Children',
                        date: 'September 11, 2026',
                        excerpt: 'A horrific accident took place near Pimpalgaon on the Nagpur-Raipur highway early morning. Victims are currently under intensive medical care...',
                        img: 'https://images.unsplash.com/photo-1511919884226-fd3cad34687c?auto=format&fit=crop&w=600&q=80',
                        url: '#'
                    }
                ]);
            };

            const categories = [
                { name: 'Accident', link: 'accident.html', active: true },
                { name: 'Agriculture', link: '#', active: false },
                { name: 'Environment', link: '#', active: false },
                { name: 'Trending', link: '#', active: false },
                { name: 'Special Feature', link: '#', active: false },
                { name: 'Crime', link: '#', active: false },
                { name: 'Business', link: '#', active: false },
                { name: 'Education', link: '#', active: false }
            ];

            return (
                <div className="min-h-screen bg-gray-100 flex flex-col justify-between">
                    <div>
                        {/* Header Banner */}
                        <div className="bg-punya-red py-3 shadow-md text-white text-center">
                            <h1 className="text-4xl md:text-5xl font-extrabold tracking-widest uppercase">
                                PUNYA<span className="text-yellow-300">॥</span>NAGARI
                            </h1>
                        </div>

                        {/* Top Information Bar */}
                        <div className="bg-gray-200 border-b border-gray-300 py-1.5 px-4">
                            <div className="max-w-7xl mx-auto flex flex-wrap justify-between items-center text-xs md:text-sm">
                                <div className="flex items-center space-x-2 text-gray-700 font-semibold">
                                    <i className="fa-regular fa-calendar-days text-red-600"></i>
                                    <span>{time}</span>
                                </div>
                                <button className="bg-red-600 text-white font-bold px-3 py-1 rounded text-xs flex items-center gap-1">
                                    <i className="fa-solid fa-newspaper"></i> E-PAPER
                                </button>
                                <div className="relative">
                                    <input type="text" placeholder="Search ..." className="pl-3 pr-8 py-0.5 text-xs border rounded-full focus:outline-none" />
                                    <i className="fa-solid fa-magnifying-glass absolute right-2.5 top-1.5 text-gray-500 text-xs"></i>
                                </div>
                            </div>
                        </div>

                        {/* Navigation Menu */}
                        <nav className="bg-white border-b border-gray-300 shadow-sm sticky top-0 z-50">
                            <div className="max-w-7xl mx-auto px-2 flex items-center overflow-x-auto whitespace-nowrap text-xs font-bold py-2">
                                <a href="front.html" className="bg-red-600 text-white p-2 rounded mr-2 flex items-center justify-center">
                                    <i className="fa-solid fa-house"></i>
                                </a>

                                {categories.map((cat, idx) => (
                                    <a
                                        key={idx}
                                        href={cat.link}
                                        className={`px-3 py-1 mx-0.5 rounded transition ${
                                            cat.active 
                                                ? 'text-red-600 font-extrabold border-b-2 border-red-600 bg-red-50' 
                                                : 'text-gray-700 hover:text-red-600'
                                        }`}
                                    >
                                        {cat.name}
                                    </a>
                                ))}
                            </div>
                        </nav>

                        {/* Main Grid Content Area */}
                        <div className="max-w-7xl mx-auto px-2 py-4 flex flex-col lg:flex-row gap-4">
                            
                            {/* News Feed Grid */}
                            <div className="flex-1">
                                <div className="bg-red-600 text-white p-2.5 rounded mb-4 font-bold flex items-center gap-2 text-sm shadow">
                                    <i className="fa-solid fa-triangle-exclamation"></i>
                                    <span>Live Accident News</span>
                                </div>

                                {loading ? (
                                    <div className="text-center py-12 font-bold text-gray-500 flex justify-center items-center gap-2">
                                        <i className="fa-solid fa-spinner fa-spin text-red-600 text-xl"></i>
                                        Loading News...
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        {articles.map((item) => (
                                            <div key={item.id} className="bg-white border rounded shadow-sm hover:shadow-md transition overflow-hidden flex flex-col justify-between p-3">
                                                <div>
                                                    <img src={item.img} className="w-full h-44 object-cover rounded mb-2" alt={item.title} />
                                                    <span className="bg-red-600 text-white text-[10px] font-bold px-2 py-0.5 rounded inline-block mb-2">
                                                        ACCIDENT
                                                    </span>
                                                    <h3 className="font-bold text-sm leading-snug text-gray-900 mb-2 hover:text-red-600 cursor-pointer">
                                                        {item.title}
                                                    </h3>
                                                    <p className="text-[11px] text-gray-400 mb-2">
                                                        <i className="fa-regular fa-clock mr-1"></i>{item.date}
                                                    </p>
                                                    <p className="text-xs text-gray-600 leading-relaxed mb-3 line-clamp-3">
                                                        {item.excerpt}
                                                    </p>
                                                </div>
                                                <a href={item.url} target="_blank" rel="noopener noreferrer" className="text-xs font-bold text-red-600 hover:underline inline-block mt-auto">
                                                    Read More &rarr;
                                                </a>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>

                            {/* Sidebar Section */}
                            <div className="w-full lg:w-64 bg-white border p-2 rounded shadow-sm shrink-0 h-fit">
                                <div className="text-center bg-blue-900 text-white p-3 rounded">
                                    <span className="bg-yellow-400 text-black px-2 py-0.5 text-[10px] font-bold rounded">ADMISSIONS OPEN 2026-27</span>
                                    <h4 className="font-bold mt-2 text-sm">MIT-ADT UNIVERSITY, PUNE</h4>
                                    <p className="text-[11px] text-gray-200 mt-1">A Lifetime Journey of Learning, Growth & Excellence</p>
                                </div>
                                <div className="mt-3 border p-2 rounded text-center">
                                    <p className="text-xs font-bold text-gray-700">Scan QR to Apply</p>
                                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=MITADT" className="w-32 h-32 mx-auto my-2" alt="QR Code" />
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AccidentPage />);
    </script>
</body>
</html>
