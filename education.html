<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punyanagari - Education News</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Mukta', sans-serif; background-color: #f8fafc; }</style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        const EducationPage = () => {
            const [time, setTime] = useState('');
            const [articles, setArticles] = useState([]);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const updateTime = () => {
                    const now = new Date();
                    setTime(`${now.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })} at ${now.toLocaleTimeString('en-US', { hour12: true })}`);
                };
                updateTime();
                setInterval(updateTime, 1000);
            }, []);

            useEffect(() => {
                const API_KEY = "5d05254fb522460cb1f0c00f267f0a46";
                fetch(`https://newsapi.org/v2/everything?q=education OR exam OR university&sortBy=publishedAt&language=en&apiKey=${API_KEY}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.status === "ok" && data.articles?.length > 0) {
                            setArticles(data.articles.slice(0, 9).map((item, idx) => ({
                                id: idx,
                                title: item.title,
                                excerpt: item.description || "Click below to read full educational updates...",
                                img: item.urlToImage || 'https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=600&q=80',
                                date: new Date(item.publishedAt).toLocaleDateString(),
                                url: item.url
                            })));
                        }
                        setLoading(false);
                    })
                    .catch(() => setLoading(false));
            }, []);

            return (
                <div className="min-h-screen flex flex-col justify-between">
                    <div>
                        <div className="bg-[#d32f2f] py-3 text-white text-center">
                            <h1 className="text-4xl md:text-5xl font-extrabold tracking-widest">PUNYA<span className="text-yellow-300">॥</span>NAGARI</h1>
                        </div>
                        <div className="bg-gray-200 py-1.5 px-4 text-xs md:text-sm flex justify-between items-center max-w-7xl mx-auto">
                            <span className="font-semibold text-gray-700"><i className="fa-regular fa-calendar-days text-red-600 mr-2"></i>{time}</span>
                            <button className="bg-red-600 text-white font-bold px-3 py-1 rounded text-xs">E-PAPER</button>
                        </div>
                        <nav className="bg-white border-b sticky top-0 z-50">
                            <div className="max-w-7xl mx-auto px-2 flex items-center overflow-x-auto text-xs font-bold py-2">
                                <a href="front.html" className="bg-red-600 text-white p-2 rounded mr-2"><i className="fa-solid fa-house"></i></a>
                                <a href="accident.html" className="px-3 py-1 text-gray-700">Accidents</a>
                                <a href="agriculture.html" className="px-3 py-1 text-gray-700">Agriculture</a>
                                <a href="crime.html" className="px-3 py-1 text-gray-700">Crime</a>
                                <a href="finance.html" className="px-3 py-1 text-gray-700">Finance</a>
                                <a href="education.html" className="px-3 py-1 text-red-600 font-extrabold border-b-2 border-red-600 bg-red-50">Education</a>
                            </div>
                        </nav>
                        <div className="max-w-7xl mx-auto px-2 py-4 flex flex-col lg:flex-row gap-4">
                            <div className="flex-1">
                                <div className="bg-red-600 text-white p-2.5 rounded mb-4 font-bold text-sm"><i className="fa-solid fa-graduation-cap mr-2"></i>Live Education News</div>
                                {loading ? <div className="text-center py-10">Loading...</div> : (
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        {articles.map((item) => (
                                            <div key={item.id} className="bg-white border rounded p-3 flex flex-col justify-between shadow-sm">
                                                <div>
                                                    <img src={item.img} className="w-full h-44 object-cover rounded mb-2" />
                                                    <span className="bg-purple-600 text-white text-[10px] font-bold px-2 py-0.5 rounded">EDUCATION</span>
                                                    <h3 className="font-bold text-sm my-2">{item.title}</h3>
                                                    <p className="text-[11px] text-gray-400 mb-2">{item.date}</p>
                                                    <p className="text-xs text-gray-600 line-clamp-3 mb-3">{item.excerpt}</p>
                                                </div>
                                                <a href={item.url} target="_blank" className="text-xs font-bold text-red-600">Read More &rarr;</a>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };
        ReactDOM.createRoot(document.getElementById('root')).render(<EducationPage />);
    </script>
</body>
</html>
