<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punya Nagari - Accident News Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Font Awesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .bg-punya-red { background-color: #d32f2f; }
        .text-punya-red { color: #d32f2f; }
    </style>
</head>
<body>

    <!-- React Root Container -->
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const PunyanagariPortal = () => {
            // State for live date and time display
            const [time, setTime] = useState('');

            // Real-time clock timer initialization
            useEffect(() => {
                const updateTime = () => {
                    const now = new Date();
                    const options = { year: 'numeric', month: 'long', day: 'numeric' };
                    const dateStr = now.toLocaleDateString('en-US', options);
                    const timeStr = now.toLocaleTimeString('en-US', { hour12: true });
                    setTime(`${dateStr} at ${timeStr}`);
                };
                updateTime();
                const timer = setInterval(updateTime, 1000);
                return () => clearInterval(timer);
            }, []);

            // Navigation categories with correct spelling
            const categories = [
                'Agriculture', 'Environment', 'Trending', 'Special Features', 'Crime', 
                'Finance', 'Education', 'Entertainment', 'International', 'Science-Tech', 
                'National', 'Legal', 'Politics', 'Government', 'Social', 'Sports', 'Editorial', 
                'Human Interest', 'Health', 'Events'
            ];

            // Updated newsData containing actual Accident news and relevant images
            const newsData = [
                {
                    id: 1,
                    tags: ['Accident', 'Highway'],
                    img1: 'https://images.unsplash.com/photo-1563720223185-11003d516935?auto=format&fit=crop&w=400&q=80',
                    img2: 'https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?auto=format&fit=crop&w=400&q=80',
                    title: "Fatal Collision Between Private Bus and Truck on Mumbai-Pune Expressway",
                    date: "September 15, 2026",
                    excerpt: "At least 4 injured as a speeding luxury bus crashed into a stationary freight truck near Khalapur toll plaza early Tuesday morning..."
                },
                {
                    id: 2,
                    tags: ['Accident', 'City News'],
                    img1: 'https://images.unsplash.com/photo-1511919884226-fd3cad34687c?auto=format&fit=crop&w=400&q=80',
                    img2: 'https://images.unsplash.com/photo-1508974239320-0a029497e820?auto=format&fit=crop&w=400&q=80',
                    title: "Multi-Vehicle Pileup on Ring Road Due to Low Visibility and Oily Road Surface",
                    date: "September 15, 2026",
                    excerpt: "Six vehicles collided sequentially during peak morning rush hour. Traffic police arrived promptly to clear the congestion and rescue trapped passengers..."
                },
                {
                    id: 3,
                    tags: ['Accident', 'Safety Alert'],
                    img1: 'https://images.unsplash.com/photo-1489824904134-891ab64532f1?auto=format&fit=crop&w=400&q=80',
                    img2: 'https://images.unsplash.com/photo-1558981806-ec527fa84c39?auto=format&fit=crop&w=400&q=80',
                    title: "Two-Wheeler Crashes at Sharp Turn in Ghat Section; Rider Saved by Helmet",
                    date: "September 14, 2026",
                    excerpt: "Local authorities emphasize helmet safety after a motorcyclist survived a high-impact fall off the mountain road curve yesterday..."
                }
            ];

            // Sidebar quick news updates
            const sideNews = [
                "Heavy rainfall alert for Maharashtra in the next 24 hours; Meteorological department issues Red Alert",
                "Major slump in stock market; Sensex plummets by 500 points",
                "T20 Cricket Series: Stunning victory for India, clinches the series"
            ];

            return (
                <div className="min-h-screen bg-gray-100 flex flex-col justify-between">
                    <div>
                        {/* Top Advertisement Banner */}
                        <div className="max-w-7xl mx-auto my-2 px-2">
                            <div className="bg-blue-900 text-white rounded p-3 flex items-center justify-between text-xs md:text-sm shadow">
                                <div className="flex items-center space-x-3">
                                    <span className="bg-red-600 px-2 py-1 font-bold rounded">MIT-ADT UNIVERSITY</span>
                                    <div>
                                        <h4 className="font-bold">MIT Art, Design & Technology University, Pune</h4>
                                        <p className="hidden md:block">Studying at MIT-ADT University, A Lifetime Journey of Learning, Growth & Excellence...!</p>
                                    </div>
                                </div>
                                <div className="bg-yellow-400 text-black px-3 py-1 font-bold rounded shrink-0">
                                    ADMISSIONS OPEN 2026-27
                                </div>
                            </div>
                        </div>

                        {/* Primary Red Header / Masthead */}
                        <div className="bg-punya-red py-4 shadow-md">
                            <div className="max-w-7xl mx-auto flex justify-center items-center">
                                <div className="text-center text-white">
                                    <h1 className="text-5xl md:text-6xl font-extrabold tracking-wider border-b-2 border-white pb-1 inline-block uppercase">
                                        Punya<span className="text-yellow-300">॥</span>Nagari
                                    </h1>
                                </div>
                            </div>
                        </div>

                        {/* Information Ribbon (Date, E-Paper Button & Search Input) */}
                        <div className="bg-gray-200 border-b border-gray-300 py-2">
                            <div className="max-w-7xl mx-auto px-4 flex flex-wrap justify-between items-center text-sm gap-2">
                                <div className="flex items-center space-x-2 text-gray-700 font-semibold">
                                    <i className="fa-regular fa-calendar-days text-red-600"></i>
                                    <span>{time || 'September 15, 2026'}</span>
                                </div>

                                <button className="bg-red-600 hover:bg-red-700 text-white font-bold px-3 py-1 rounded flex items-center gap-2 text-xs transition">
                                    <i className="fa-solid fa-newspaper"></i> E-PAPER
                                </button>

                                <div className="relative">
                                    <input 
                                        type="text" 
                                        placeholder="Search ..." 
                                        className="pl-3 pr-8 py-1 text-sm border border-gray-400 rounded-full focus:outline-none focus:ring-1 focus:ring-red-600"
                                    />
                                    <i className="fa-solid fa-magnifying-glass absolute right-3 top-2.5 text-gray-500 text-xs"></i>
                                </div>
                            </div>
                        </div>

                        {/* Main Category Navigation Bar */}
                        <nav className="bg-white border-b border-gray-300 shadow-sm sticky top-0 z-50">
                            <div className="max-w-7xl mx-auto px-2 flex items-center overflow-x-auto whitespace-nowrap text-xs md:text-sm font-semibold py-2">
                                <a href="index.html" className="bg-red-600 text-white p-2 rounded-md mr-2 flex items-center justify-center">
                                    <i className="fa-solid fa-house"></i>
                                </a>
                                
                                {/* Corrected spelling from Occident to Accident */}
                                <a href="accident.html" className="px-3 py-1 text-red-600 font-bold bg-gray-100 rounded transition border-b-2 border-red-600">
                                    Accidents
                                </a>

                                {categories.map((cat, idx) => (
                                    <a key={idx} href="#" className="px-3 py-1 text-gray-800 hover:text-red-600 hover:bg-gray-100 rounded transition">
                                        {cat}
                                    </a>
                                ))}
                            </div>
                        </nav>

                        {/* Main Content Layout Container */}
                        <div className="max-w-7xl mx-auto px-2 py-4 flex flex-col lg:flex-row gap-4">
                            
                            {/* Left Side Partner Advertisement */}
                            <div className="hidden lg:block w-48 bg-white border p-2 text-center text-xs shadow-sm h-fit shrink-0">
                                <span className="bg-black text-white px-1 text-[10px]">MEDIA PARTNER</span>
                                <div className="font-bold text-red-600 my-2">Punya Nagari</div>
                                <img src="https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=200&q=80" className="w-full mb-2 rounded" alt="Ad" />
                                <p className="font-bold">ADMISSIONS OPEN 2026-27</p>
                            </div>

                            {/* Middle Section: News Grid Display */}
                            <div className="flex-1">
                                {/* Accident Section Banner Header */}
                                <div className="bg-red-600 text-white p-2 rounded mb-4 font-bold flex items-center gap-2 text-sm shadow">
                                    <i className="fa-solid fa-triangle-exclamation text-yellow-300"></i>
                                    <span>Live Accident News / अपघात बातम्या</span>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    {newsData.map((item) => (
                                        <div key={item.id} className="bg-white p-3 border rounded shadow-sm hover:shadow-md transition flex flex-col justify-between">
                                            <div>
                                                {/* News Tags */}
                                                <div className="flex gap-1 mb-2 flex-wrap">
                                                    {item.tags.map((tag, i) => (
                                                        <span key={i} className="bg-red-600 text-white text-[10px] font-bold px-2 py-0.5 rounded">
                                                            {tag}
                                                        </span>
                                                    ))}
                                                </div>
                                                {/* Dual Image Thumbnails */}
                                                <div className="grid grid-cols-2 gap-1 mb-2">
                                                    <img src={item.img1} className="w-full h-28 object-cover rounded" alt="Accident Spot" />
                                                    <img src={item.img2} className="w-full h-28 object-cover rounded" alt="Vehicle Damage" />
                                                </div>
                                                {/* News Heading */}
                                                <h3 className="font-bold text-sm leading-snug mb-2 hover:text-red-600 cursor-pointer">
                                                    {item.title}
                                                </h3>
                                                {/* Publication Timestamp */}
                                                <p className="text-xs text-gray-500 mb-2">
                                                    <i className="fa-regular fa-clock mr-1"></i>{item.date}
                                                </p>
                                                {/* News Summary Excerpt */}
                                                <p className="text-xs text-gray-700 leading-relaxed mb-3">
                                                    {item.excerpt}
                                                </p>
                                            </div>
                                            {/* Read More Link */}
                                            <a href="#" className="text-xs text-red-600 font-bold hover:underline inline-block">
                                                Read More <i className="fa-solid fa-arrow-right text-[10px]"></i>
                                            </a>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Right Sidebar: Trending & Quick News */}
                            <div className="w-full lg:w-64 bg-white border p-3 rounded shadow-sm h-fit shrink-0">
                                <h3 className="font-bold border-b-2 border-red-600 pb-1 mb-3 text-red-600 text-sm flex items-center gap-2">
                                    <i className="fa-solid fa-bolt"></i> Key Updates
                                </h3>
                                <ul className="space-y-3 divide-y">
                                    {sideNews.map((news, idx) => (
                                        <li key={idx} className={`${idx !== 0 ? 'pt-2' : ''}`}>
                                            <a href="#" className="text-xs font-semibold text-gray-800 hover:text-red-600 leading-snug block">
                                                {news}
                                            </a>
                                        </li>
                                    ))}
                                </ul>
                            </div>

                        </div>
                    </div>

                    {/* Footer Section */}
                    <footer className="bg-gray-900 text-white mt-8 py-6 text-xs border-t-4 border-red-600">
                        <div className="max-w-7xl mx-auto px-4 text-center">
                            <p className="text-sm font-bold text-red-500 mb-2">Punya Nagari ePaper & News Channel</p>
                            <p className="text-gray-400 mb-4">All Rights Reserved © 2026 Daily Punya Nagari</p>
                            {/* Social Media Links */}
                            <div className="flex justify-center space-x-4 text-gray-400 text-base">
                                <a href="#" className="hover:text-white"><i className="fa-brands fa-facebook"></i></a>
                                <a href="#" className="hover:text-white"><i className="fa-brands fa-twitter"></i></a>
                                <a href="#" className="hover:text-white"><i className="fa-brands fa-instagram"></i></a>
                                <a href="#" className="hover:text-white"><i className="fa-brands fa-youtube"></i></a>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        // Render Application Component to DOM
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PunyanagariPortal />);
    </script>
</body>
</html>
