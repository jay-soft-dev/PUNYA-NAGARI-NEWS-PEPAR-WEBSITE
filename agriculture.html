<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punyanagari - Agriculture News</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Mukta', sans-serif; background-color: #f8fafc; }
        .bg-punya-red { background-color: #d32f2f; }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const AgriculturePage = () => {
            const [time, setTime] = useState('');
            const [articles, setArticles] = useState([]);
            const [loading, setLoading] = useState(true);
            const [searchTerm, setSearchTerm] = useState('');

            // Live Time Setup
            useEffect(() => {
                const updateTime = () => {
                    const now = new Date();
                    const options = { year: 'numeric', month: 'long', day: 'numeric' };
                    const dateStr = now.toLocaleDateString('en-US', options);
                    const timeStr = now.toLocaleTimeString('en-US', { hour12: true });
                    setTime(`${dateStr} at ${timeStr}`);
                };
                updateTime();
                const timer = setInterval(updateTime, 1000);
                return () => clearInterval(timer);
            }, []);

            // Fallback Data
            const fallbackNews = [
                {
                    id: 1,
                    title: 'Rabi Crop Yield Projections Rise Following Extended Monsoon Spells',
                    date: 'September 17, 2026',
                    excerpt: 'Agricultural experts predict favorable soil moisture retention benefits upcoming sowing cycles across Maharashtra.',
                    img: 'https://images.unsplash.com/photo-1500937386664-56d1dfef3854?auto=format&fit=crop&w=600&q=80',
                    tags: ['Agri', 'Monsoon'],
                    url: 'https://newsdata.io'
                },
                {
                    id: 2,
                    title: 'महाराष्ट्रात अवकाळी पावसामुळे पिकांचे नुकसान; पंचनाम्याचे आदेश',
                    date: 'September 17, 2026',
                    excerpt: 'राज्य शासनाकडून नुकसानग्रस्त भागातील शेतीच्या पाहणीचे तातडीने निर्देश देण्यात आले आहेत.',
                    img: 'https://images.unsplash.com/photo-1592982537447-7440770cbfc9?auto=format&fit=crop&w=600&q=80',
                    tags: ['Agri', 'Weather'],
                    url: 'https://newsdata.io'
                },
                {
                    id: 3,
                    title: 'कांदा आणि कापसाच्या बाजारभावात सुधारणा; APMC मध्ये आवक वाढली',
                    date: 'September 17, 2026',
                    excerpt: 'मुख्य कृषी उत्पन्न बाजार समित्यांमध्ये शेतमालाची आवक वाढल्याने दरामध्ये सुधारणा झाली आहे.',
                    img: 'https://images.unsplash.com/photo-1586771107445-d3ca888129ff?auto=format&fit=crop&w=600&q=80',
                    tags: ['Mandi', 'Price'],
                    url: 'https://newsdata.io'
                }
            ];

            // Fetch News using NewsData.io Free Public API
            const fetchNewsFromNewsData = async () => {
                setLoading(true);
                try {
                    // Free API Key for NewsData.io
                    const apiKey = 'pub_53526fbc1e7d206f6bf53ae40e2b10a26620f';
                    const apiUrl = `https://newsdata.io/api/1/news?apikey=${apiKey}&q=agriculture&country=in&language=mr,en`;

                    const res = await fetch(apiUrl);
                    const data = await res.json();

                    if (data.status === 'success' && data.results && data.results.length > 0) {
                        const fetched = data.results.map((item, idx) => ({
                            id: item.article_id || `news-${idx}`,
                            title: item.title,
                            excerpt: item.description ? item.description.substring(0, 130) + '...' : 'अधिनियमानुसार शेतीविषयक माहिती आणि ताज्या घडामोडी...',
                            img: item.image_url || 'https://images.unsplash.com/photo-1500937386664-56d1dfef3854?auto=format&fit=crop&w=600&q=80',
                            date: item.pubDate ? new Date(item.pubDate).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : 'September 17, 2026',
                            tags: item.category ? [item.category[0].toUpperCase()] : ['Agri', 'News'],
                            url: item.link
                        }));

                        setArticles(fetched);
                    } else {
                        setArticles(fallbackNews);
                    }
                } catch (err) {
                    console.error("News API Error:", err);
                    setArticles(fallbackNews);
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                fetchNewsFromNewsData();
            }, []);

            const categories = [
                { name: 'Accidents', link: 'accident.html', active: false },
                { name: 'Agriculture', link: 'agriculture.html', active: true },
                { name: 'Environment', link: '#', active: false },
                { name: 'Trending', link: '#', active: false },
                { name: 'Special Features', link: '#', active: false },
                { name: 'Crime', link: '#', active: false },
                { name: 'Finance', link: '#', active: false },
                { name: 'Education', link: '#', active: false }
            ];

            const filteredArticles = articles.filter(art => 
                art.title.toLowerCase().includes(searchTerm.toLowerCase()) || 
                art.excerpt.toLowerCase().includes(searchTerm.toLowerCase())
            );

            return (
                <div className="min-h-screen bg-gray-100 flex flex-col justify-between">
                    <div>
                        {/* Header Banner */}
                        <div className="bg-punya-red py-3 shadow-md text-white text-center">
                            <h1 className="text-4xl md:text-5xl font-extrabold tracking-widest uppercase">
                                PUNYA<span className="text-yellow-300">॥</span>NAGARI
                            </h1>
                        </div>

                        {/* Sub Topbar */}
                        <div className="bg-gray-200 border-b border-gray-300 py-1.5 px-4">
                            <div className="max-w-7xl mx-auto flex flex-wrap justify-between items-center text-xs md:text-sm gap-2">
                                <div className="flex items-center space-x-2 text-gray-700 font-semibold">
                                    <i className="fa-regular fa-calendar-days text-red-600"></i>
                                    <span>{time}</span>
                                </div>
                                <div className="flex items-center gap-2">
                                    <button onClick={fetchNewsFromNewsData} className="bg-gray-800 text-white font-bold px-2.5 py-1 rounded text-xs flex items-center gap-1 hover:bg-black">
                                        <i className="fa-solid fa-rotate-right"></i> Refresh API
                                    </button>
                                    <button className="bg-red-600 text-white font-bold px-3 py-1 rounded text-xs">
                                        <i className="fa-solid fa-newspaper mr-1"></i> E-PAPER
                                    </button>
                                </div>
                                <div className="relative">
                                    <input 
                                        type="text" 
                                        placeholder="Search news..." 
                                        value={searchTerm}
                                        onChange={(e) => setSearchTerm(e.target.value)}
                                        className="pl-3 pr-8 py-0.5 text-xs border rounded-full focus:outline-none focus:ring-1 focus:ring-red-500" 
                                    />
                                    <i className="fa-solid fa-magnifying-glass absolute right-2.5 top-1.5 text-gray-500 text-xs"></i>
                                </div>
                            </div>
                        </div>

                        {/* Navigation Menu */}
                        <nav className="bg-white border-b border-gray-300 shadow-sm sticky top-0 z-50">
                            <div className="max-w-7xl mx-auto px-2 flex items-center overflow-x-auto whitespace-nowrap text-xs font-bold py-2">
                                <a href="front.html" className="bg-red-600 text-white p-2 rounded mr-2 flex items-center justify-center">
                                    <i className="fa-solid fa-house"></i>
                                </a>

                                {categories.map((cat, idx) => (
                                    <a
                                        key={idx}
                                        href={cat.link}
                                        className={`px-3 py-1 mx-0.5 rounded transition ${
                                            cat.active 
                                                ? 'bg-red-600 text-white font-extrabold' 
                                                : 'text-gray-700 hover:text-red-600'
                                        }`}
                                    >
                                        {cat.name}
                                    </a>
                                ))}
                            </div>
                        </nav>

                        {/* Main Body */}
                        <div className="max-w-7xl mx-auto px-2 py-4 flex flex-col lg:flex-row gap-4">
                            
                            {/* Left Side Sidebar */}
                            <div className="w-full lg:w-48 bg-white border p-3 rounded shadow-sm shrink-0 h-fit text-center">
                                <span className="bg-black text-white text-[9px] font-bold px-1.5 py-0.5 rounded uppercase">Media Partner</span>
                                <p className="text-red-600 font-bold text-xs mt-1">Punya Nagari</p>
                                <img src="https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=300&q=80" className="w-full h-32 object-cover rounded my-2" alt="Admissions" />
                                <p className="text-xs font-bold text-gray-800">ADMISSIONS OPEN 2026-27</p>
                            </div>

                            {/* Middle Grid - News Content */}
                            <div className="flex-1">
                                <div className="bg-punya-red text-white p-2.5 rounded mb-4 font-bold flex items-center justify-between text-sm shadow">
                                    <div className="flex items-center gap-2">
                                        <i className="fa-solid fa-triangle-exclamation"></i>
                                        <span>Agriculture News / बातम्या</span>
                                    </div>
                                    <span className="text-xs bg-red-800 px-2 py-0.5 rounded">
                                        Showing {filteredArticles.length} articles
                                    </span>
                                </div>

                                {loading ? (
                                    <div className="text-center py-16 font-bold text-gray-600 flex flex-col justify-center items-center gap-3">
                                        <i className="fa-solid fa-spinner fa-spin text-red-600 text-3xl"></i>
                                        <span>NewsData.io वरून ताज्या बातम्या लोड होत आहेत...</span>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
                                        {filteredArticles.map((item) => (
                                            <div key={item.id} className="bg-white border rounded shadow-sm hover:shadow-md transition overflow-hidden flex flex-col justify-between p-3">
                                                <div>
                                                    <img src={item.img} className="w-full h-36 object-cover rounded mb-2" alt={item.title} />
                                                    <div className="flex gap-1 mb-2">
                                                        {item.tags.map((tag, tIdx) => (
                                                            <span key={tIdx} className="bg-red-600 text-white text-[9px] font-bold px-1.5 py-0.5 rounded">
                                                                {tag}
                                                            </span>
                                                        ))}
                                                    </div>
                                                    <h3 className="font-bold text-sm leading-snug text-gray-900 mb-2 hover:text-red-600 cursor-pointer line-clamp-2">
                                                        {item.title}
                                                    </h3>
                                                    <p className="text-[11px] text-gray-400 mb-2">
                                                        <i className="fa-regular fa-clock mr-1"></i>{item.date}
                                                    </p>
                                                    <p className="text-xs text-gray-600 leading-relaxed mb-3 line-clamp-3">
                                                        {item.excerpt}
                                                    </p>
                                                </div>
                                                <a 
                                                    href={item.url} 
                                                    target="_blank" 
                                                    rel="noopener noreferrer" 
                                                    className="text-xs font-bold text-red-600 hover:text-red-800 flex items-center gap-1 border-t pt-2 mt-auto"
                                                >
                                                    <span>Read More</span>
                                                    <i className="fa-solid fa-arrow-right text-[10px]"></i>
                                                </a>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>

                            {/* Right Side Sidebar */}
                            <div className="w-full lg:w-64 bg-white border p-3 rounded shadow-sm shrink-0 h-fit">
                                <h4 className="font-bold text-red-600 text-sm border-b pb-1.5 mb-3 flex items-center gap-1.5">
                                    <i className="fa-solid fa-bolt"></i> Key Updates
                                </h4>
                                <div className="space-y-3 text-xs">
                                    <div className="border-b pb-2">
                                        <p className="font-semibold text-gray-800 hover:text-red-600 cursor-pointer">Heavy rainfall alert for Maharashtra in the next 24 hours; Meteorological department issues Red Alert</p>
                                    </div>
                                    <div className="border-b pb-2">
                                        <p className="font-semibold text-gray-800 hover:text-red-600 cursor-pointer">Major slump in stock market; Sensex plummets by 500 points</p>
                                    </div>
                                    <div>
                                        <p className="font-semibold text-gray-800 hover:text-red-600 cursor-pointer">T20 Cricket Series: Stunning victory for India, clinches the series</p>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AgriculturePage />);
    </script>
</body>
</html>
